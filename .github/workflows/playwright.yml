name: Smoke Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: npx playwright test

      - name: Publish CTRF report summary
        if: always()
        uses: ctrf-io/github-actions-ctrf@v1
        with:
          test-results-file: playwright-report/ctrf-report.json

      - name: Prepare GitHub Pages deployment
        if: always()
        run: |
          mkdir -p gh-pages/reports/main
          cp playwright-report/ctrf-report.json gh-pages/reports/main/ctrf-report.json
          cp testsDashboard/index.html gh-pages/index.html

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          keep_files: true
